# Dependency versions for HDSL-web.
#
# Domain-layer libraries are aligned with the HDSL desktop build this source
# was copied from (see HDSL/gradle/libs.versions.toml); everything the desktop
# UI needed (JavaFX, JFoenix, JNA, jsoup, nanohttpd, commonmark, ...) is
# deliberately absent.

[versions]
junit = "6.1.3"
jetbrains-annotations = "26.1.0"
gson = "2.14.0"
errorprone = "2.41.0"
kala-compress = "1.27.1-5"
kala-encoding-detector = "0.1.0"
xz = "1.12"
weburl = "0.2.0"
uuid-tools = "0.2.0"
jetty = "12.0.39"
snakeyaml-engine = "2.9"
bouncycastle = "1.86"
slf4j = "2.0.20"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
kala-compress-zip = { module = "org.glavo.kala:kala-compress-archivers-zip", version.ref = "kala-compress" }
kala-compress-tar = { module = "org.glavo.kala:kala-compress-archivers-tar", version.ref = "kala-compress" }
kala-compress-ar = { module = "org.glavo.kala:kala-compress-archivers-ar", version.ref = "kala-compress" }
kala-encoding-detector = { module = "org.glavo:kala-encoding-detector", version.ref = "kala-encoding-detector" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
weburl = { module = "org.glavo:weburl", version.ref = "weburl" }
uuid-tools = { module = "org.glavo:uuid-tools", version.ref = "uuid-tools" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
# Since Jetty 12.0.x the EE10 (Jakarta Servlet 6) modules live under their own
# groupId `org.eclipse.jetty.ee10`, not `org.eclipse.jetty`.
jetty-ee10-servlet = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet", version.ref = "jetty" }
# The jakarta WebSocket server for EE10 lives under `org.eclipse.jetty.ee10.websocket`.
jetty-ee10-websocket-jakarta-server = { module = "org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-server", version.ref = "jetty" }
# Core WebSocket server (glob path mappings, used by the /i/* upgrade relay) and client.
jetty-websocket-jetty-server = { module = "org.eclipse.jetty.websocket:jetty-websocket-jetty-server", version.ref = "jetty" }
jetty-websocket-jetty-client = { module = "org.eclipse.jetty.websocket:jetty-websocket-jetty-client", version.ref = "jetty" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
slf4j-jdk14 = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4j" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
