name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 领域层的部分测试会调用 pnpm；runner 上预置一个，避免测试被跳过。
      - name: Install pnpm
        run: npm install -g pnpm@11

      # 面板 SPA 先构建：gradle 打包时会把 web/dist 同步进 jar。
      - name: Build panel SPA
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      # 兼容底线闸门：JS 语法钉在 es2020（es-check）+ CSS 特性黑名单 +
      # env() 兜底声明配对检查（scripts/compat-check.mjs）。
      # 底线定义见 docs/compatibility.md（Firefox 115 ESR，Win7 最后一个受维护版本）。
      - name: Compatibility gate
        working-directory: web
        run: npm run compat

      # 编译 + 全部测试 + shadowJar（单 jar 产物）。
      - name: Build server and run tests
        run: ./gradlew --no-daemon build
