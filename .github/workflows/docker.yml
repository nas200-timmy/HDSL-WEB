name: docker

# 发布 amd64 + arm64 多架构镜像到 GitHub Container Registry（ghcr.io/nas200-timmy/hdsl-web）。
# 触发：打 v* 标签（自动带版本号与 latest）、或手动 dispatch（edge）。
# 构建在 GitHub 官方 runner 上进行——本仓库不依赖任何本地 Docker。
#
# arm64 由 QEMU 模拟构建；Dockerfile 的两个构建阶段（web / build）钉在
# $BUILDPLATFORM 上跑原生架构（产物与架构无关），只有 runtime 阶段按目标架构构建。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 的 runtime 阶段要在目标架构里跑 apt-get，必须先装 QEMU。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the version baked into the jar
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-edge" >> "$GITHUB_OUTPUT"
          fi

      # 只有**最新**的版本标签才移动 `latest`。
      # 没有这道闸门时，回填一个老标签（例如补一条 v0.3.9）会把 `latest` 从当前的
      # v0.4.1 拽回那个老镜像上——2026-10-15 补 v0.3.9 时踩到过：那次是构建失败才侥幸
      # 没退回去。这里按「仓库里版本号最大的 v* 标签」判断，只认它。
      - name: Is this the newest version tag?
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newest=$(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" \
                     --jq '.[].name' | grep '^v' | sort -V | tail -1)
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is not the newest version tag (${newest}); latest is not moved"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hdsl-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.newest.outputs.value == 'true' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 多架构 manifest：amd64 原生构建，arm64 走 QEMU。构建阶段已钉在
          # $BUILDPLATFORM，只有 runtime 阶段按目标架构执行。
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
